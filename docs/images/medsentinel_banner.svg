<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#030710"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Red Shield Alert Glow -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="pulseRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Filters for 3D Neon Glow -->
    <filter id="glow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 3D Perspective Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes ecgSweep {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float3D {
      0%, 100% { transform: translateY(0px) rotateX(12deg) rotateY(-8deg); }
      50% { transform: translateY(-12px) rotateX(18deg) rotateY(-4deg); }
    }
    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes ringPulse {
      0% { r: 50; opacity: 0.8; }
      100% { r: 120; opacity: 0; }
    }
    .ecg-line {
      stroke-dasharray: 1200;
      stroke-dashoffset: 0;
      animation: ecgSweep 3.5s linear infinite;
    }
    .floating-shield {
      transform-origin: center;
      animation: float3D 6s ease-in-out infinite;
    }
    .heart-pulse {
      transform-origin: center;
      animation: pulseHeart 1.6s ease-in-out infinite;
    }
    .radar-sweep {
      transform-origin: 980px 210px;
      animation: radarScan 8s linear infinite;
    }
    .pulsing-ring {
      animation: ringPulse 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#gridPattern)"/>

  <!-- Perspective 3D Floor Grid Plane -->
  <g opacity="0.35">
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="0" y1="385" x2="1200" y2="385" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="0" y1="415" x2="1200" y2="415" stroke="#00F0FF" stroke-width="2.2" stroke-opacity="0.9"/>
    <!-- Perspective radial lines -->
    <line x1="600" y1="260" x2="-200" y2="420" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.3"/>
    <line x1="600" y1="260" x2="150" y2="420" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.3"/>
    <line x1="600" y1="260" x2="450" y2="420" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.3"/>
    <line x1="600" y1="260" x2="750" y2="420" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.3"/>
    <line x1="600" y1="260" x2="1050" y2="420" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.3"/>
    <line x1="600" y1="260" x2="1400" y2="420" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.3"/>
  </g>

  <!-- Background Ambient Cyber Orbs -->
  <circle cx="200" cy="120" r="140" fill="#0284C7" opacity="0.12" filter="url(#glow3D)"/>
  <circle cx="980" cy="210" r="160" fill="#00F0FF" opacity="0.08" filter="url(#glow3D)"/>
  <circle cx="980" cy="210" r="90" fill="#EF4444" opacity="0.09" filter="url(#glow3D)"/>

  <!-- Left: Medical ECG Waveform Stream in 3D Layer -->
  <g filter="url(#softGlow)" opacity="0.85">
    <path class="ecg-line" d="M 40 260 L 160 260 L 180 250 L 195 275 L 215 130 L 235 310 L 250 245 L 265 260 L 320 260 L 340 248 L 355 260 L 480 260 L 500 250 L 515 275 L 535 130 L 555 310 L 570 245 L 585 260 L 680 260 L 700 250 L 715 275 L 735 130 L 755 310 L 770 245 L 785 260 L 880 260" 
          fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Subtitle Branding (Left Block) -->
  <g transform="translate(60, 80)">
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect width="360" height="28" rx="14" fill="#0F172A" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="14" cy="14" r="5" fill="#00F0FF" filter="url(#softGlow)"/>
      <text x="28" y="18" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.2">
        CYBER-PHYSICAL HOSPITAL FRAMEWORK
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="72" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5">
      MEDSENTINEL <tspan fill="url(#cyanGlow)">CPS</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="104" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="500" letter-spacing="0.2">
      Zero-Trust Cybersecurity &amp; Patient Safety Risk Engine
    </text>
    <text x="0" y="126" fill="#64748B" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400">
      Protecting Connected Medical Devices with Guaranteed Treatment Continuity
    </text>

    <!-- Key Metrics Badges -->
    <g transform="translate(0, 160)">
      <!-- Badge 1: Life-Support Safety Rule -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" stroke-opacity="0.5"/>
        <text x="12" y="16" fill="#A5B4FC" font-family="'Inter', sans-serif" font-size="9" font-weight="700">TREATMENT CONTINUITY</text>
        <text x="12" y="30" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">NO SHUTDOWN RULE</text>
      </g>

      <!-- Badge 2: Isolation Forest AI -->
      <g transform="translate(195, 0)">
        <rect width="170" height="38" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
        <text x="12" y="16" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="9" font-weight="700">INTELLIGENCE LAYER</text>
        <text x="12" y="30" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">ISOLATION FOREST</text>
      </g>

      <!-- Badge 3: 4-Quadrant Monitor -->
      <g transform="translate(380, 0)">
        <rect width="165" height="38" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1" stroke-opacity="0.5"/>
        <text x="12" y="16" fill="#FCA5A5" font-family="'Inter', sans-serif" font-size="9" font-weight="700">CLINICAL OUTPUT</text>
        <text x="12" y="30" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">4-QUADRANT VIEW</text>
      </g>
    </g>
  </g>

  <!-- Right: 3D Isometric Cyber-Physical Hologram Shield & Radar System -->
  <g transform="translate(980, 205)">
    <!-- Radar concentric scan circles -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4,6" opacity="0.3"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#0284C7" stroke-width="1.2" opacity="0.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.7"/>

    <!-- Dynamic Pulsing Shockwave Rings -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#00F0FF" stroke-width="2" class="pulsing-ring" opacity="0.8"/>

    <!-- Rotating Radar Scanner Beam -->
    <g class="radar-sweep">
      <path d="M 0 0 L 130 -40 A 136 136 0 0 1 130 40 Z" fill="url(#cyanGlow)" opacity="0.12"/>
      <line x1="0" y1="0" x2="136" y2="0" stroke="#00F0FF" stroke-width="2" opacity="0.8" filter="url(#softGlow)"/>
    </g>

    <!-- 3D Layered Isometric Shield Floating Group -->
    <g class="floating-shield" filter="url(#glow3D)">
      <!-- Outer Shield Shadow -->
      <path d="M 0 -70 L 60 -35 L 60 30 C 60 70 0 100 0 100 C 0 100 -60 70 -60 30 L -60 -35 Z" 
            fill="#030712" stroke="#00F0FF" stroke-width="3" opacity="0.95"/>

      <!-- Inner Shield Glass Panel -->
      <path d="M 0 -58 L 48 -28 L 48 24 C 48 58 0 84 0 84 C 0 84 -48 58 -48 24 L -48 -28 Z" 
            fill="url(#shieldGrad)" opacity="0.45"/>

      <!-- Center Medical Cross / Caduceus Core Symbol -->
      <g class="heart-pulse">
        <!-- Medical Cross -->
        <rect x="-8" y="-32" width="16" height="52" rx="4" fill="#FFFFFF" filter="url(#softGlow)"/>
        <rect x="-26" y="-14" width="52" height="16" rx="4" fill="#FFFFFF" filter="url(#softGlow)"/>
        <!-- Inner Heart -->
        <circle cx="0" cy="-6" r="6" fill="#EF4444" filter="url(#softGlow)"/>
      </g>

      <!-- Microchips / Satellite Nodes around Shield -->
      <circle cx="75" cy="-45" r="4" fill="#00F0FF" filter="url(#softGlow)"/>
      <line x1="60" y1="-35" x2="75" y2="-45" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="2,2"/>

      <circle cx="-75" cy="45" r="4" fill="#10B981" filter="url(#softGlow)"/>
      <line x1="-60" y1="30" x2="-75" y2="45" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2,2"/>

      <circle cx="75" cy="45" r="4" fill="#EF4444" filter="url(#softGlow)"/>
      <line x1="60" y1="30" x2="75" y2="45" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="2,2"/>
    </g>
  </g>
</svg>
