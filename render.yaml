services:
  # Python FastAPI Backend Web Service
  - type: web
    name: medsentinel-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: SIMULATION_ENABLED
        value: "true"
      - key: SIMULATION_INTERVAL_SECONDS
        value: "1.0"

  # React Vite Frontend Static Site
  - type: web
    name: medsentinel-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

